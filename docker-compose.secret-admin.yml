# Opt-in write-only web Admin secrets + supervised restart. Protect the entire
# web console and its APIs with an authenticating reverse proxy first.
#
# Host setup (UID/GID must match the harness runtime, normally node = 1000):
#   mkdir -p private-env && chmod 700 private-env
#   sudo chown 1000:1000 private-env
#   docker compose -f docker-compose.yml -f docker-compose.secret-admin.yml up -d --build
#
# Keep this directory outside ./data, channel workspaces and source control.
# Mount the directory, not the file: writes atomically replace the file.
services:
  harness:
    environment:
      HARNESS_MANAGED_ENV_FILE: /app/private-env/managed-env.json
      # Only safe because the base service has restart: unless-stopped.
      HARNESS_ALLOW_RESTART: "1"
    volumes:
      - ./private-env:/app/private-env
    # The harness bounds graceful shutdown at 10 seconds.
    stop_grace_period: 15s
